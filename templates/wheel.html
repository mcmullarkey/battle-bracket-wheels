{{define "wheel"}}
<div id="wheel-{{.SlotID}}-{{.ID}}">
  <svg viewBox="0 0 200 200" width="200" height="200">
    <defs>
      <!-- Tie-dye / lava lamp radial gradients — bright Y2K colors, off-center for blobby organic look -->
      <radialGradient id="td0" cx="28%" cy="32%" r="85%">
        <stop offset="0%" stop-color="#ff69b4"/>
        <stop offset="30%" stop-color="#ff1493"/>
        <stop offset="60%" stop-color="#8a2be2"/>
        <stop offset="100%" stop-color="#4b0082"/>
      </radialGradient>
      <radialGradient id="td1" cx="72%" cy="35%" r="80%">
        <stop offset="0%" stop-color="#00bfff"/>
        <stop offset="30%" stop-color="#1e90ff"/>
        <stop offset="60%" stop-color="#9400d3"/>
        <stop offset="100%" stop-color="#4b0082"/>
      </radialGradient>
      <radialGradient id="td2" cx="45%" cy="18%" r="88%">
        <stop offset="0%" stop-color="#ccff00"/>
        <stop offset="25%" stop-color="#00ff7f"/>
        <stop offset="55%" stop-color="#00bfff"/>
        <stop offset="100%" stop-color="#8a2be2"/>
      </radialGradient>
      <radialGradient id="td3" cx="62%" cy="72%" r="75%">
        <stop offset="0%" stop-color="#ff8c00"/>
        <stop offset="30%" stop-color="#ff69b4"/>
        <stop offset="65%" stop-color="#ff1493"/>
        <stop offset="100%" stop-color="#9400d3"/>
      </radialGradient>
      <radialGradient id="td4" cx="22%" cy="65%" r="82%">
        <stop offset="0%" stop-color="#00ffff"/>
        <stop offset="35%" stop-color="#00bfff"/>
        <stop offset="70%" stop-color="#ccff00"/>
        <stop offset="100%" stop-color="#ff69b4"/>
      </radialGradient>
      <radialGradient id="td5" cx="50%" cy="50%" r="85%">
        <stop offset="0%" stop-color="#ff00ff"/>
        <stop offset="25%" stop-color="#8a2be2"/>
        <stop offset="55%" stop-color="#00bfff"/>
        <stop offset="100%" stop-color="#ccff00"/>
      </radialGradient>
      <radialGradient id="td6" cx="38%" cy="78%" r="78%">
        <stop offset="0%" stop-color="#ffd700"/>
        <stop offset="30%" stop-color="#ff8c00"/>
        <stop offset="60%" stop-color="#ff1493"/>
        <stop offset="100%" stop-color="#4b0082"/>
      </radialGradient>
      <radialGradient id="td7" cx="68%" cy="22%" r="82%">
        <stop offset="0%" stop-color="#7fff00"/>
        <stop offset="30%" stop-color="#00ffff"/>
        <stop offset="60%" stop-color="#9400d3"/>
        <stop offset="100%" stop-color="#ff1493"/>
      </radialGradient>
    </defs>
    <!-- Pointer at top (outside rotating group) -->
    <polygon points="100,25 93,10 107,10" fill="#ffd700" stroke="#ffd700" stroke-width="1"/>
    <g class="wheel-group" id="wheel-group-{{.SlotID}}-{{.ID}}">
      {{range $opt := .Options}}
        {{range $path := $opt.ArcPaths}}
          <path d="{{$path}}" class="wheel-slice" data-option="{{$opt.Text}}" fill="url(#td{{mod $opt.Index 8}})"></path>
        {{end}}
        <text x="{{printf "%.1f" $opt.TextX}}" y="{{printf "%.1f" $opt.TextY}}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="11" font-family="Courier New, monospace" font-weight="bold" data-option-text="{{$opt.Text}}">{{$opt.Text}}</text>
      {{end}}
      <circle cx="100" cy="100" r="10" fill="#ffd700" stroke="#fff" stroke-width="2"></circle>
    </g>
  </svg>
  {{if not .ReadOnly}}
  <form hx-post="/wheel/{{.ID}}/option" hx-target="#wheel-{{.SlotID}}-{{.ID}}" hx-swap="outerHTML">
    <input type="text" name="text" placeholder="Add option..." required>
    <button type="submit">Add</button>
  </form>
  {{end}}
</div>
{{end}}
